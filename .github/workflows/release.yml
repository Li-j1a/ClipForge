name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf release
          df -h > build.log 2>&1
          du -sh node_modules >> build.log 2>&1
          npm run dist -- --publish never >> build.log 2>&1 || {
            echo "first attempt failed; retrying" >> build.log
            df -h >> build.log 2>&1
            rm -rf release
            npm run dist -- --publish never >> build.log 2>&1 || echo "second attempt failed" >> build.log
          }

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          echo "::error::DISK$(df -h 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%%0A%s", $0}')"
          echo "::error::FILES$(du -sh release node_modules 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%%0A%s", $0}')"
          tail -n 30 build.log 2>/dev/null | tr -d '\r' | sed -E 's/\x1b\[[0-9;]*[mK]//g' | sed 's/%/%25/g' | awk '{printf "::error::%s%%0A", $0}'

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls release/*.exe | head -n 1)
          hash=$(sha256sum "$installer" | awk '{print $1}')
          body="ClipForge ${GITHUB_REF_NAME} — Windows desktop video converter.

          - Real FFmpeg/FFprobe transcoding: MP4, MKV, WebM, H.265
          - Compatibility / high-quality / small-size presets
          - Serial queue, real FFmpeg progress, cancellation
          - Safe output naming, history, settings

          Windows 10/11 x64. Unsigned installer — SmartScreen may warn.

          SHA-256: ${hash}"
          gh release create "${GITHUB_REF_NAME}" "$installer" \
            --title "ClipForge ${GITHUB_REF_NAME}" \
            --notes "$body" --latest
